spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: narayan-staffing
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/narayan_staffing}
    username: ${DATABASE_USERNAME:narayan}
    password: ${DATABASE_PASSWORD:narayan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-narayan-staffing-jwt-secret-32b}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  storage:
    path: ${FILE_STORAGE_PATH:./storage}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:hr@narayanstaffingservices.com}
  security:
    sensitive-data-key: ${SENSITIVE_DATA_KEY:ZGV2LW9ubHktbmFyYXlhbi1zdGFmZmluZy1rZXk=}
  bootstrap:
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-password: ${APP_ADMIN_PASSWORD:}
    admin-name: ${APP_ADMIN_NAME:Narayan Admin}
    seed-sample-data: false
