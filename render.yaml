services:
  - type: web
    name: narayan-staffing-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
      - key: DATABASE_URL
        fromDatabase:
          name: narayan-staffing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SENSITIVE_DATA_KEY
        generateValue: true
      - key: FILE_STORAGE_PATH
        value: /data/storage
      - key: MAIL_ENABLED
        value: "false"
      - key: APP_ADMIN_EMAIL
        value: admin@narayanstaffingservices.com
      - key: APP_ADMIN_PASSWORD
        value: Narayan@Live2026
      - key: APP_ADMIN_NAME
        value: Narayan Admin
      - key: APP_SEED_SAMPLE_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: https://narayan-staffing.netlify.app
      - key: APP_PUBLIC_BASE_URL
        value: https://narayan-staffing.netlify.app

databases:
  - name: narayan-staffing-db
    plan: free
    region: oregon
    databaseName: narayan_staffing
    user: narayan
